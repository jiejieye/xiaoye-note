<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" width="720" height="320" role="img" aria-label="演示：在更多菜单打开批量删除，点选多个日程后一次删除">
<title>批量删除演示</title>
<style>
  text { font-family: "Microsoft YaHei UI", "PingFang SC", "Noto Sans CJK SC", sans-serif; }
  .t { fill: #eeeeee; font-size: 14px; }
  .s { fill: #a8a8a8; font-size: 12px; }
  .b { font-weight: 700; }
  .loop { animation-duration: 10s; animation-iteration-count: infinite; animation-timing-function: ease; }
  #menu { animation-name: menu; }
  @keyframes menu { 0%, 8% { opacity: 0 } 11%, 22% { opacity: 1 } 25%, 100% { opacity: 0 } }
  #menuHit { animation-name: hit; }
  @keyframes hit { 0%, 18% { opacity: 0 } 20% { opacity: 1 } 24%, 100% { opacity: 0 } }
  #bar { animation-name: bar; }
  @keyframes bar { 0%, 24% { opacity: 0 } 27%, 90% { opacity: 1 } 94%, 100% { opacity: 0 } }
  #n1 { animation-name: n1; } #n2 { animation-name: n2; } #n3 { animation-name: n3; }
  @keyframes n1 { 0%, 34% { opacity: 1 } 35%, 100% { opacity: 0 } }
  @keyframes n2 { 0%, 34% { opacity: 0 } 35%, 43% { opacity: 1 } 44%, 100% { opacity: 0 } }
  @keyframes n3 { 0%, 43% { opacity: 0 } 44%, 52% { opacity: 1 } 53%, 100% { opacity: 0 } }
  #n4 { animation-name: n4; }
  @keyframes n4 { 0%, 52% { opacity: 0 } 53%, 68% { opacity: 1 } 69%, 100% { opacity: 0 } }
  #n0 { animation-name: n0; }
  @keyframes n0 { 0%, 68% { opacity: 0 } 69%, 90% { opacity: 1 } 94%, 100% { opacity: 0 } }
  #s1 { animation-name: s1; } #s2 { animation-name: s2; } #s3 { animation-name: s3; }
  @keyframes s1 { 0%, 34% { opacity: 0 } 35%, 64% { opacity: 1 } 68%, 100% { opacity: 0 } }
  @keyframes s2 { 0%, 43% { opacity: 0 } 44%, 64% { opacity: 1 } 68%, 100% { opacity: 0 } }
  @keyframes s3 { 0%, 52% { opacity: 0 } 53%, 64% { opacity: 1 } 68%, 100% { opacity: 0 } }
  #p1, #p2, #p3 { animation-name: gone; transform-box: fill-box; transform-origin: center; }
  @keyframes gone { 0%, 64% { opacity: 1; transform: scale(1) } 69%, 94% { opacity: 0; transform: scale(.6) } 98%, 100% { opacity: 1; transform: scale(1) } }
  #dim { animation-name: dim; }
  @keyframes dim { 0%, 24% { opacity: 1 } 27%, 90% { opacity: .55 } 94%, 100% { opacity: 1 } }
  #delHit { animation-name: delhit; }
  @keyframes delhit { 0%, 62% { opacity: 0 } 64% { opacity: 1 } 68%, 100% { opacity: 0 } }
  #cursor { animation-name: cursor; }
  @keyframes cursor {
    0% { transform: translate(560px, 250px) } 7% { transform: translate(682px, 30px) } 9% { transform: translate(682px, 30px) scale(.85) } 11% { transform: translate(682px, 30px) }
    18% { transform: translate(628px, 96px) } 20% { transform: translate(628px, 96px) scale(.85) } 22% { transform: translate(628px, 96px) }
    33% { transform: translate(150px, 128px) } 35% { transform: translate(150px, 128px) scale(.85) }
    42% { transform: translate(260px, 184px) } 44% { transform: translate(260px, 184px) scale(.85) }
    51% { transform: translate(470px, 128px) } 53% { transform: translate(470px, 128px) scale(.85) }
    61% { transform: translate(548px, 30px) } 63% { transform: translate(548px, 30px) scale(.85) } 65% { transform: translate(548px, 30px) }
    90% { transform: translate(560px, 250px) } 100% { transform: translate(560px, 250px) } }
</style>
<rect width="720" height="320" rx="14" fill="#232426"/>
<rect x="12" y="10" width="696" height="300" rx="12" fill="#3a3b3d" stroke="#4a4b4e"/>
<text x="30" y="40" class="t b" font-size="16">2026年11月</text>
<rect x="666" y="20" width="32" height="28" rx="7" fill="#2f3033" stroke="#55575b"/><text x="674" y="39" class="t b">⋯</text>
<g id="bar" class="loop">
  <text id="n1" class="loop s" x="452" y="39">已选 0</text><text id="n2" class="loop s" x="452" y="39">已选 1</text><text id="n3" class="loop s" x="452" y="39">已选 2</text><text id="n4" class="loop s" x="452" y="39">已选 3</text><text id="n0" class="loop s" x="452" y="39">已选 0</text>
  <rect x="508" y="20" width="58" height="28" rx="7" fill="#ef6c78" fill-opacity=".18" stroke="#ef6c78"/><text x="522" y="39" fill="#ef6c78" font-size="13">删除</text>
  <rect id="delHit" class="loop" x="508" y="20" width="58" height="28" rx="7" fill="#ef6c78" fill-opacity=".55"/>
  <rect x="572" y="20" width="58" height="28" rx="7" fill="#2f3033" stroke="#55575b"/><text x="587" y="39" class="t" font-size="13">完成</text>
</g>
<g stroke="#4a4b4e" fill="none">
  <rect x="24" y="64" width="672" height="210"/>
  <path d="M120 64v210M216 64v210M312 64v210M408 64v210M504 64v210M600 64v210M24 169h672"/>
</g>
<g class="t" font-size="13">
  <text x="32" y="84">16</text><text x="128" y="84">17</text><text x="224" y="84">18</text><text x="320" y="84">19</text><text x="416" y="84" fill="#ffd21a">20</text><text x="512" y="84">21</text><text x="608" y="84">22</text>
  <text x="32" y="188">23</text><text x="128" y="188">24</text><text x="224" y="188">25</text><text x="320" y="188">26</text><text x="416" y="188">27</text><text x="512" y="188">28</text><text x="608" y="188">29</text>
</g>
<g id="dim" class="loop">
  <rect x="30" y="94" width="84" height="18" rx="4" fill="#64b5f6"/><text x="35" y="107" fill="#0c2b4a" font-size="11">晨会同步</text>
  <rect x="222" y="94" width="84" height="18" rx="4" fill="#64b5f6"/><text x="227" y="107" fill="#0c2b4a" font-size="11">晨会同步</text>
  <rect x="414" y="94" width="84" height="18" rx="4" fill="#e57373"/><text x="419" y="107" fill="#3a0b0b" font-size="11">专注写方案</text>
  <rect x="30" y="198" width="84" height="18" rx="4" fill="#64b5f6"/><text x="35" y="211" fill="#0c2b4a" font-size="11">晨会同步</text>
  <rect x="414" y="198" width="84" height="18" rx="4" fill="#ba68c8"/><text x="419" y="211" fill="#2a1030" font-size="11">项目评审</text>
</g>
<g id="p1" class="loop"><rect x="126" y="118" width="84" height="18" rx="4" fill="#ffb74d"/><text x="131" y="131" fill="#3b2400" font-size="11">旧会议</text></g>
<rect id="s1" class="loop" x="124" y="116" width="88" height="22" rx="5" fill="none" stroke="#ef6c78" stroke-width="2"/>
<g id="p2" class="loop"><rect x="222" y="198" width="84" height="18" rx="4" fill="#4db6ac"/><text x="227" y="211" fill="#04342c" font-size="11">取消的课</text></g>
<rect id="s2" class="loop" x="220" y="196" width="88" height="22" rx="5" fill="none" stroke="#ef6c78" stroke-width="2"/>
<g id="p3" class="loop"><rect x="414" y="118" width="84" height="18" rx="4" fill="#81c784"/><text x="419" y="131" fill="#173404" font-size="11">已改期</text></g>
<rect id="s3" class="loop" x="412" y="116" width="88" height="22" rx="5" fill="none" stroke="#ef6c78" stroke-width="2"/>
<g id="menu" class="loop">
  <rect x="560" y="54" width="136" height="118" rx="10" fill="#2b2c2e" stroke="#55575b"/>
  <text x="576" y="80" class="t" font-size="13">流动浮窗</text>
  <rect x="566" y="88" width="124" height="26" rx="6" fill="#ffd21a" fill-opacity=".14" stroke="#c9a400"/><text x="576" y="106" fill="#ffd21a" font-size="13" class="b">批量删除</text>
  <rect id="menuHit" class="loop" x="566" y="88" width="124" height="26" rx="6" fill="#ffd21a" fill-opacity=".35"/>
  <text x="576" y="136" class="t" font-size="13">连续月视图</text><text x="576" y="160" class="t" font-size="13">节假日</text>
</g>
<text x="30" y="296" class="s">打开后：点日程多选 · 点日期空白处选中当天全部 · 删除的内容可在回收站恢复</text>
<g id="cursor" class="loop"><path d="M0 0v18l5-5 4 9 3-1-4-9h7z" fill="#ffffff" stroke="#111" stroke-width="1.2"/></g>
</svg>

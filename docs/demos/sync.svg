<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" width="720" height="340" role="img" aria-label="演示：开启多电脑同步的 4 个步骤，完成后两台电脑自动同步">
<title>多电脑同步演示</title>
<style>
  text { font-family: "Microsoft YaHei UI", "PingFang SC", "Noto Sans CJK SC", sans-serif; }
  .t { fill: #eeeeee; font-size: 14px; }
  .s { fill: #a8a8a8; font-size: 12px; }
  .b { font-weight: 700; }
  .loop { animation-duration: 11s; animation-iteration-count: infinite; animation-timing-function: ease; }
  .card { fill: #2f3033; stroke: #45464a; }
  #c1 { animation-name: c1; } #c2 { animation-name: c2; } #c3 { animation-name: c3; } #c4 { animation-name: c4; }
  @keyframes c1 { 0%, 3% { stroke: #45464a } 6%, 18% { stroke: #ffd21a } 21%, 100% { stroke: #3f8f5a } }
  @keyframes c2 { 0%, 20% { stroke: #45464a } 23%, 36% { stroke: #ffd21a } 39%, 100% { stroke: #3f8f5a } }
  @keyframes c3 { 0%, 38% { stroke: #45464a } 41%, 54% { stroke: #ffd21a } 57%, 100% { stroke: #3f8f5a } }
  @keyframes c4 { 0%, 56% { stroke: #45464a } 59%, 70% { stroke: #ffd21a } 73%, 100% { stroke: #3f8f5a } }
  #k1 { animation-name: k1; } #k2 { animation-name: k2; } #k3 { animation-name: k3; } #k4 { animation-name: k4; }
  @keyframes k1 { 0%, 19% { opacity: 0 } 22%, 96% { opacity: 1 } 100% { opacity: 0 } }
  @keyframes k2 { 0%, 37% { opacity: 0 } 40%, 96% { opacity: 1 } 100% { opacity: 0 } }
  @keyframes k3 { 0%, 55% { opacity: 0 } 58%, 96% { opacity: 1 } 100% { opacity: 0 } }
  @keyframes k4 { 0%, 71% { opacity: 0 } 74%, 96% { opacity: 1 } 100% { opacity: 0 } }
  #u1 { animation-name: u1; } #u2 { animation-name: u2; } #u3 { animation-name: u3; }
  @keyframes u1 { 0%, 25% { opacity: 0 } 28%, 96% { opacity: 1 } 100% { opacity: 0 } }
  @keyframes u2 { 0%, 31% { opacity: 0 } 34%, 96% { opacity: 1 } 100% { opacity: 0 } }
  @keyframes u3 { 0%, 46% { opacity: 0 } 50%, 96% { opacity: 1 } 100% { opacity: 0 } }
  #pw { animation-name: pw; }
  @keyframes pw { 0%, 61% { opacity: 0 } 64%, 96% { opacity: 1 } 100% { opacity: 0 } }
  #done { animation-name: done; }
  @keyframes done { 0%, 74% { opacity: 0 } 78%, 96% { opacity: 1 } 100% { opacity: 0 } }
  #dots { animation-name: dots; }
  @keyframes dots { 0%, 74% { opacity: 0 } 78%, 96% { opacity: 1 } 100% { opacity: 0 } }
  .dot { animation: flow 1.2s linear infinite; }
  .dot:nth-child(2) { animation-delay: .4s } .dot:nth-child(3) { animation-delay: .8s }
  @keyframes flow { 0% { transform: translateX(0); opacity: 0 } 20% { opacity: 1 } 80% { opacity: 1 } 100% { transform: translateX(120px); opacity: 0 } }
</style>
<rect width="720" height="340" rx="14" fill="#232426"/>
<text x="24" y="36" class="t b" font-size="16">设置 → 多电脑同步：4 步完成，以后自动同步</text>

<g>
  <rect id="c1" class="loop card" x="24" y="56" width="158" height="150" rx="12" stroke-width="2"/>
  <text x="40" y="84" class="t b">1. 注册免费云端</text>
  <text x="40" y="106" class="s">打开 Supabase</text><text x="40" y="124" class="s">新建一个项目</text>
  <rect x="40" y="144" width="126" height="28" rx="7" fill="#3b526c"/><text x="58" y="163" class="t" font-size="12">打开注册页面</text>
  <g id="k1" class="loop"><circle cx="160" cy="80" r="11" fill="#3f8f5a"/><path d="M154 80l4 4 8-8" stroke="#fff" stroke-width="2.2" fill="none"/></g>
</g>
<g>
  <rect id="c2" class="loop card" x="196" y="56" width="158" height="150" rx="12" stroke-width="2"/>
  <text x="212" y="84" class="t b">2. 粘贴连接信息</text>
  <rect x="212" y="98" width="126" height="22" rx="5" fill="#36373a"/>
  <text id="u1" class="loop s" x="218" y="114" font-size="11">https://xxxx.supabase.co</text>
  <rect x="212" y="126" width="126" height="22" rx="5" fill="#36373a"/>
  <text id="u2" class="loop s" x="218" y="142" font-size="11">sb_publishable_••••</text>
  <rect x="212" y="158" width="126" height="28" rx="7" fill="#3b526c"/><text x="232" y="177" class="t" font-size="12">从剪贴板粘贴</text>
  <g id="k2" class="loop"><circle cx="332" cy="80" r="11" fill="#3f8f5a"/><path d="M326 80l4 4 8-8" stroke="#fff" stroke-width="2.2" fill="none"/></g>
</g>
<g>
  <rect id="c3" class="loop card" x="368" y="56" width="158" height="150" rx="12" stroke-width="2"/>
  <text x="384" y="84" class="t b">3. 初始化数据库</text>
  <text x="384" y="106" class="s">复制脚本 → SQL 编辑器</text><text x="384" y="124" class="s">粘贴后点 Run</text>
  <rect x="384" y="140" width="56" height="26" rx="7" fill="#3b526c"/><text x="394" y="158" class="t" font-size="12">复制</text>
  <rect x="446" y="140" width="64" height="26" rx="7" fill="#3b526c"/><text x="462" y="158" class="t" font-size="12">检查</text>
  <text id="u3" class="loop" x="384" y="190" fill="#7fd18f" font-size="12">✓ 数据库已就绪</text>
  <g id="k3" class="loop"><circle cx="504" cy="80" r="11" fill="#3f8f5a"/><path d="M498 80l4 4 8-8" stroke="#fff" stroke-width="2.2" fill="none"/></g>
</g>
<g>
  <rect id="c4" class="loop card" x="540" y="56" width="156" height="150" rx="12" stroke-width="2"/>
  <text x="556" y="84" class="t b">4. 注册 / 登录</text>
  <rect x="556" y="98" width="124" height="22" rx="5" fill="#36373a"/><text x="562" y="114" class="s" font-size="11">me@example.com</text>
  <rect x="556" y="126" width="124" height="22" rx="5" fill="#36373a"/><text id="pw" class="loop s" x="562" y="142" font-size="11">••••••••</text>
  <rect x="556" y="158" width="58" height="28" rx="7" fill="#ffd21a"/><text x="570" y="177" fill="#1a1500" font-size="12" class="b">登录</text>
  <rect x="620" y="158" width="60" height="28" rx="7" fill="#3b526c"/><text x="632" y="177" class="t" font-size="12">注册</text>
  <g id="k4" class="loop"><circle cx="674" cy="80" r="11" fill="#3f8f5a"/><path d="M668 80l4 4 8-8" stroke="#fff" stroke-width="2.2" fill="none"/></g>
</g>

<g transform="translate(150 226)">
  <rect x="0" y="0" width="120" height="74" rx="8" fill="#2f3033" stroke="#55575b"/><rect x="10" y="10" width="100" height="46" rx="4" fill="#3a3b3d"/>
  <rect x="18" y="18" width="40" height="10" rx="3" fill="#64b5f6"/><rect x="18" y="34" width="60" height="10" rx="3" fill="#ffd21a"/>
  <path d="M-12 82h144" stroke="#55575b" stroke-width="5" stroke-linecap="round"/>
  <text x="20" y="104" class="s">办公室电脑</text>
</g>
<g id="dots" class="loop" transform="translate(296 262)">
  <circle class="dot" cx="0" cy="0" r="5" fill="#ffd21a"/><circle class="dot" cx="0" cy="0" r="5" fill="#ffd21a"/><circle class="dot" cx="0" cy="0" r="5" fill="#ffd21a"/>
</g>
<g transform="translate(446 226)">
  <rect x="0" y="0" width="120" height="74" rx="8" fill="#2f3033" stroke="#55575b"/><rect x="10" y="10" width="100" height="46" rx="4" fill="#3a3b3d"/>
  <rect x="18" y="18" width="40" height="10" rx="3" fill="#64b5f6"/><rect x="18" y="34" width="60" height="10" rx="3" fill="#ffd21a"/>
  <path d="M-12 82h144" stroke="#55575b" stroke-width="5" stroke-linecap="round"/>
  <text x="30" y="104" class="s">家里电脑</text>
</g>
<text id="done" class="loop" x="300" y="300" fill="#7fd18f" font-size="14" font-weight="700">✓ 已自动同步</text>
<text x="590" y="250" class="s">第二台电脑：</text><text x="590" y="268" class="s">粘贴“连接码”</text><text x="590" y="286" class="s">再登录即可</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="720" height="220" viewBox="0 0 720 220" role="img" aria-labelledby="title desc">
  <title id="title">多电脑同步</title>
  <desc id="desc">第一台电脑上传备份，通过自己的 Supabase 项目，在另一台 Windows 电脑登录同一账号并下载。</desc>
  <style>
    text { font-family: "Microsoft YaHei UI", "PingFang SC", "Noto Sans CJK SC", sans-serif; }
    .heading { font-size: 21px; font-weight: 700; fill: #f1f1f1; }
    .label { font-size: 15px; fill: #d1d2d5; }
    .data { animation: transfer 7s ease-in-out infinite; }
    .arrived { animation: received 7s ease-in-out infinite; }
    @keyframes transfer { 0%, 12% { transform: translateX(0); opacity: 0; } 22% { opacity: 1; } 43%, 54% { transform: translateX(126px); opacity: 1; } 73% { opacity: 1; } 83%, 100% { transform: translateX(252px); opacity: 0; } }
    @keyframes received { 0%, 73%, 100% { opacity: .28; } 81%, 95% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .data, .arrived { animation: none; } .data { opacity: 0; } }
  </style>
  <rect width="720" height="220" rx="14" fill="#232426"/>
  <text x="25" y="41" class="heading">多电脑同步</text>
  <path d="M226 117H494" fill="none" stroke="#666970" stroke-width="2" stroke-dasharray="4 6"/>
  <path d="m277 112 5 5-5 5m162-10 5 5-5 5" fill="none" stroke="#a6abb3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#2d2f34" stroke="#555962">
    <rect x="42" y="72" width="184" height="97" rx="10"/>
    <rect x="494" y="72" width="184" height="97" rx="10"/>
  </g>
  <path d="M111 170v6h46v-6m406 0v6h46v-6" stroke="#626773" fill="none" stroke-width="2"/>
  <g fill="#ffd21a">
    <rect x="55" y="85" width="21" height="7" rx="3"/>
    <rect x="507" y="85" width="21" height="7" rx="3"/>
  </g>
  <g fill="#42464e"><rect x="56" y="109" width="155" height="39" rx="5"/><rect x="508" y="109" width="155" height="39" rx="5"/></g>
  <g fill="#8cb9e9"><rect x="65" y="117" width="87" height="7" rx="3"/><rect x="65" y="132" width="114" height="7" rx="3"/></g>
  <g class="arrived" fill="#8cb9e9"><rect x="517" y="117" width="87" height="7" rx="3"/><rect x="517" y="132" width="114" height="7" rx="3"/></g>
  <rect x="299" y="80" width="122" height="79" rx="12" fill="#2c3431" stroke="#52695d"/>
  <path d="m363 88-15 19h11v12l15-19h-11z" fill="#7bdfaa"/>
  <text x="360" y="143" text-anchor="middle" class="label">自己的 Supabase</text>
  <circle class="data" cx="234" cy="117" r="5" fill="#ffd21a" opacity="0"/>
  <text x="134" y="202" text-anchor="middle" class="label">上传备份</text>
  <text x="586" y="202" text-anchor="middle" class="label">同账号登录后下载</text>
</svg>
